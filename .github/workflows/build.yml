name: Build and Release MemeDock

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-test:
    name: Test (Rust + Frontend)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test

  build-bundles:
    name: Build (${{ matrix.platform }})
    needs: check-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri bundles
        if: github.ref_type != 'tag'
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Build and sign release bundles
        if: github.ref_type == 'tag'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri build --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json

      - name: Verify NSIS installation in Program Files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          $installer = Get-ChildItem $bundle -Filter '*-setup.exe' | Select-Object -First 1
          $installDir = Join-Path $env:ProgramFiles 'MemeDock'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', '/AllUsers' -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path (Join-Path $installDir 'meme-dock.exe') -PathType Leaf)) {
            throw "NSIS did not install MemeDock in Program Files (exit code $($process.ExitCode))."
          }

      - name: Upload Windows installers
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: memedock-${{ matrix.platform }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig

      - name: Upload macOS bundles
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: memedock-${{ matrix.platform }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-bundles
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: memedock-*
          merge-multiple: true
          path: release-assets

      - name: Create update manifest
        run: python3 scripts/build-update-manifest.py release-assets "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"

      - name: Publish installers and update manifest together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > release-draft-status; then
            if [[ "$(cat release-draft-status)" == false ]]; then
              exit 0
            fi
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes "${assets[@]}"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
